# Publica Butarque en GitHub Pages cada vez que se sube algo a la rama main.
# El workflow compila la web y la sube a la rama gh-pages; Pages la sirve desde esa rama.
# Activar una vez en el repositorio: Settings -> Pages -> Source: "Deploy from a branch",
# rama gh-pages, carpeta / (root).
# La web queda en https://<usuario>.github.io/<repositorio>/
#
#   /          portada
#   /mapa/     Mapa vivo (ficheros estáticos, sin servidor ni base de datos)
#   /arcade/   Arcade de Butarque (los juegos se compilan aquí con pygbag)

name: Publicar Butarque en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # botón "Run workflow" para publicar a mano

permissions:
  contents: write             # para subir la web a la rama gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del Arcade
        run: pip install pygame pygbag==0.9.3

      - name: Pasar las pruebas del Arcade
        working-directory: arcade_butarque
        run: |
          (cd excavacion_butarque && python -m unittest discover tests)
          (cd cazadores_manzanares && python -m unittest discover tests)

      - name: Compilar los juegos
        run: bash arcade_butarque/construir_web.sh

      - name: Montar la web
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r img _site/img
          cp -r mapa _site/mapa
          cp -r arcade_butarque/_site _site/arcade
          ls -R _site | head -50

      - name: Subir la web a la rama gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar la web (${GITHUB_SHA::7})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
